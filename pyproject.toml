[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jbudget"
version = "0.1.0"
description = "Import des relevés ING (CSV) et VISA (PDF), classement automatique des dépenses par règles."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "flask>=3.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jbudget = "jbudget.cli:app"

[tool.setuptools.packages.find]
include = ["jbudget*"]

[tool.setuptools.package-data]
"jbudget.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
